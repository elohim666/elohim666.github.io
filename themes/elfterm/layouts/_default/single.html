{{ define "main" }}

<article>

<h1>{{ .Title }}</h1>
<div class="meta">
  {{ .Date.Format "2006-01-02" }}  |  author: {{ .Site.Params.author }}{{ with .Params.tags }}  |  tags: {{ delimit . ", " }}{{ end }}
</div>

{{ .Content }}

{{ with .Params.medium_url }}
<div class="repost">originally published on <a href="{{ . }}" rel="nofollow">medium</a></div>
{{ end }}

<div class="sep">- - - EOF - - -</div>

</article>

{{ end }}
